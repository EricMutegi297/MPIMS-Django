services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mpims_db
      POSTGRES_USER: mpims_user
      POSTGRES_PASSWORD: mpims_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://mpims_user:mpims_pass@db:5432/mpims_db
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=mpims_db
      - DB_USER=mpims_user
      - DB_PASSWORD=mpims_pass
      - SECRET_KEY=change-me-in-production
      - DEBUG=True
      - ALLOWED_HOSTS=192.168.90.244,localhost,127.0.0.1
      - CORS_ALLOWED_ORIGINS=http://192.168.90.244:3000,http://localhost:3000
      - CSRF_TRUSTED_ORIGINS=http://192.168.90.244:3000,http://localhost:3000
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://192.168.90.244:8000
        REACT_APP_WS_URL: http://192.168.90.244:4000
    restart: unless-stopped
    ports:
      - "3000:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - REACT_APP_API_URL=http://192.168.90.244:8000
      - REACT_APP_WS_URL=http://192.168.90.244:4000
    depends_on:
      - backend

  realtime:
    build: ./realtime
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgres://mpims_user:mpims_pass@db:5432/mpims_db
      - DJANGO_API_URL=http://backend:8000
      - CORS_ORIGIN=http://192.168.90.244:3000,http://localhost:3000
      - PORT=4000
    depends_on:
      - db
      - backend

volumes:
  postgres_data:
